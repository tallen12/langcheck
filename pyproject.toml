[project]
name = "langcheck"
version = "0.1.0"
description = "LLM-backed spelling and grammar checker with a FastAPI service and CLI"
readme = "README.md"
authors = [
    { name = "Tyler Allen", email = "tallen12@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=5.3.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.optional-dependencies]
# Scorer models; install exactly one PyTorch build with `just setup <build>`. The service
# runs without them when no scorer is configured.
cpu = ["torch==2.14.1", "transformers>=5.20.2"]
cuda = ["torch==2.14.1", "transformers>=5.20.2"]
rocm = ["torch==2.14.1", "transformers>=5.20.2", "triton-rocm==3.8.0"]
# Evaluation (`langcheck evaluate`): ERRANT and the spaCy model it parses with.
eval = ["errant>=3.0.2", "spacy>=3.8.16", "en-core-web-sm"]

[project.scripts]
langcheck = "langcheck.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# preshed 3.0.14 (2026-10-24) breaks spaCy model loading on Python 3.14 with an
# OverflowError in Tokenizer._flush_specials; 3.0.13 works (as in contcheck).
constraint-dependencies = ["preshed!=3.0.14"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [
    # macOS takes PyPI's build, which is the CPU (and MPS) build there.
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
# The ROCm torch needs triton-rocm, which exists only on the ROCm index.
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["design-docs"]

[tool.ruff.per-file-target-version]
# LibreOffice runs this package in its own Python: 3.8 in LibreOffice 7.x on Windows and
# macOS. `just libreoffice` imports it under Python 3.8 to check.
"src/langcheck/libreoffice/**" = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "RUF", "PTH"]

[tool.ty.environment]
# Stubs for the UNO modules LibreOffice provides to the extension at run time.
extra-paths = ["stubs"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not models and not llm and not libreoffice"]
markers = [
    "models: downloads a pretrained Hugging Face model",
    "llm: needs a running LLM server",
    "libreoffice: drives a real LibreOffice (soffice with Python uno)",
]

[tool.coverage.run]
source = ["langcheck"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
    "types-pyyaml>=6.0.12.20260906",
]
