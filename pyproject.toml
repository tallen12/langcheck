[project]
name = "langcheck"
version = "0.1.0"
description = "LLM-backed spelling and grammar checker with a FastAPI service and CLI"
readme = "README.md"
authors = [
    { name = "Tyler Allen", email = "tallen12@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=5.3.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Scorer models; install exactly one PyTorch build with `just setup <build>`. The service
# runs without them when no scorer is configured.
cpu = ["torch==2.14.1", "transformers>=5.20.2"]
cuda = ["torch==2.14.1", "transformers>=5.20.2"]
rocm = ["torch==2.14.1", "transformers>=5.20.2", "triton-rocm==3.8.0"]

[project.scripts]
langcheck = "langcheck.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    # macOS takes PyPI's build, which is the CPU (and MPS) build there.
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
# The ROCm torch needs triton-rocm, which exists only on the ROCm index.
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["design-docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "RUF", "PTH"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not models and not llm"]
markers = [
    "models: downloads a pretrained Hugging Face model",
    "llm: needs a running LLM server",
]

[tool.coverage.run]
source = ["langcheck"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
    "types-pyyaml>=6.0.12.20260906",
]
