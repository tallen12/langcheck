# Copy to langcheck.yaml (git-ignored) and adjust. langcheck reads langcheck.yaml from the
# directory it starts in; --config or LANGCHECK_CONFIG name another file.
llm:
  base_url: http://localhost:11434/v1
  model: gemma4:12b-it-q4_K_M
  # Sends reasoning_effort: none, which Ollama takes. Other servers may reject it with a 400.
  disable_reasoning: true
  concurrency: 4

# Uncomment to have the trained tagger find errors and judge the LLM's corrections.
# Needs a PyTorch build (just setup cpu).
# correction:
#   checkpoint: runs/tagger-context2
#   device: cpu
#   # Also uncomment to correct flags with a local model instead of the LLM.
#   proposer: runs/proposer-context2
